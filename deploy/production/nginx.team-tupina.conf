server {
    listen 80;
    server_name teamtupina.com.br www.teamtupina.com.br;

    root /var/www/team-tupina-site;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name app.teamtupina.com.br;

    client_max_body_size 64m;

    location /static/ {
        alias /var/lib/docker/volumes/team_tupina_static/_data/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/lib/docker/volumes/team_tupina_media/_data/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
